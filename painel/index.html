<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#36373b">
<title>Painel · Hotel Itapuã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#36373b;--slate-2:#44464b;--ink:#26272a;
  --ivory:#f4efe5;--ivory-2:#eae2d4;--sand:#e2d0ba;
  --copper:#c4865b;--copper-deep:#a86a40;
  --coastal:#85a6c2;--coastal-deep:#5d7e9c;
  --green:#5b8a6a;--red:#b4503e;--amber:#b9852f;
  --muted:#6a665e;--line:rgba(54,55,59,.13);--card:#fff;
  --shadow:0 14px 34px -24px rgba(20,18,16,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{font-family:"Outfit",system-ui,sans-serif;color:var(--ink);background:var(--ivory);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
h1,h2,h3{font-family:"Marcellus",Georgia,serif;font-weight:400;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:3px;padding:10px 16px;font-size:.9rem;font-weight:500;letter-spacing:.02em;transition:background .15s,transform .12s,border-color .15s;user-select:none;-webkit-user-select:none;min-height:42px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--copper);color:#fff}
.btn-primary:active{background:var(--copper-deep)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-danger{background:transparent;border-color:rgba(180,80,62,.4);color:var(--red)}
.btn-danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{min-height:34px;padding:6px 12px;font-size:.82rem}
.btn[disabled]{opacity:.5;pointer-events:none}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{background:var(--copper-deep)}
  .btn-ghost:hover{border-color:var(--copper);background:rgba(196,134,91,.08)}
  .nav button:hover{background:rgba(244,239,229,.08)}
  .card.click:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .rrow:hover{border-color:var(--copper)}
}

/* ---------- login ---------- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#2c2d31,#3a3b40 60%,#45403c);color:var(--ivory)}
.auth-card{width:min(420px,100%);background:rgba(244,239,229,.06);border:1px solid rgba(244,239,229,.16);border-radius:4px;padding:34px 28px}
.auth-card .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.auth-card h1{font-size:1.5rem;margin-bottom:4px}
.auth-card p.sub{color:rgba(244,239,229,.65);font-size:.9rem;margin-bottom:22px}
.auth label{display:block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sand);margin:14px 0 6px}
.auth input{width:100%;background:rgba(244,239,229,.08);border:1px solid rgba(244,239,229,.22);border-radius:3px;padding:12px;color:var(--ivory)}
.auth .btn{width:100%;margin-top:22px}
.auth .err{margin-top:14px;color:#f0b3a6;font-size:.88rem;min-height:1.3em}
.mark{width:30px;height:37px;flex:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100dvh}
.side{background:var(--slate);color:var(--ivory);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100dvh}
.side .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.side .brand b{font-family:"Marcellus",serif;font-weight:400;letter-spacing:.12em;font-size:1.05rem;display:block;line-height:1}
.side .brand small{display:block;font-size:.55rem;letter-spacing:.42em;color:var(--copper);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:rgba(244,239,229,.78);padding:11px 12px;border-radius:3px;text-align:left;font-size:.95rem;min-height:44px}
.nav button svg{width:20px;height:20px;flex:none}
.nav button[aria-current="page"]{background:rgba(196,134,91,.2);color:#fff}
.who{margin-top:auto;border-top:1px solid rgba(244,239,229,.14);padding:14px 8px 0;font-size:.85rem}
.who .n{font-weight:500}
.who .r{color:var(--sand);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}
.who button{margin-top:10px;background:none;border:1px solid rgba(244,239,229,.25);color:var(--ivory);border-radius:3px;padding:7px 12px;font-size:.82rem}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(1.6rem,3.4vw,2.2rem);color:var(--slate)}
.top p{color:var(--muted);font-size:.92rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  .side .brand{padding:0}
  .who{margin:0;border:0;padding:0;display:flex;align-items:center;gap:10px;text-align:right}
  .who .r{display:none}
  .who button{margin:0}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;flex-direction:row;background:var(--slate);padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(244,239,229,.14);justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex-direction:column;gap:3px;padding:7px 4px;font-size:.66rem;min-height:50px;flex:1 0 66px;text-align:center;justify-content:center}
  .main{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
}

/* ---------- cartões e listas ---------- */
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px;transition:transform .18s,box-shadow .18s}
.stat .v{font-family:"Marcellus",serif;font-size:2.2rem;line-height:1;color:var(--slate)}
.stat .l{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:1.25rem;color:var(--slate)}
.sec span{color:var(--muted);font-size:.85rem}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;flex-wrap:wrap}
.item .main-t{flex:1 1 180px;min-width:0}
.item b{font-weight:500}
.item small,.muted{color:var(--muted);font-size:.85rem}
.empty{border:1px dashed rgba(54,55,59,.25);border-radius:4px;padding:26px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.alert{border-left:4px solid var(--red);background:#fbeeea;padding:12px 14px;border-radius:3px;margin-bottom:10px;font-size:.92rem}
.alert.warn{border-color:var(--amber);background:#fbf3e1}
.chip{display:inline-flex;align-items:center;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--ivory-2);color:var(--slate);white-space:nowrap}
.chip.copper{background:rgba(196,134,91,.18);color:var(--copper-deep)}
.chip.green{background:rgba(91,138,106,.18);color:#3f6b4e}
.chip.blue{background:rgba(133,166,194,.28);color:#3d5f7c}
.chip.gray{background:rgba(54,55,59,.1);color:var(--muted)}
.chip.red{background:rgba(180,80,62,.15);color:var(--red)}

/* ---------- reservas ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{background:#fff;border:1px solid var(--line);border-radius:3px;padding:9px 12px;min-height:42px}
.filters input{flex:1 1 200px}
.rrow{display:grid;grid-template-columns:minmax(150px,1.4fr) 90px 150px 120px auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;width:100%;text-align:left;transition:border-color .15s}
.rrow.cancel{opacity:.55}
.rrow.cancel .g{text-decoration:line-through}
@media (max-width:820px){.rrow{grid-template-columns:1fr auto;grid-auto-flow:row}.rrow>*:nth-child(n+3){grid-column:1/-1}}

/* ---------- quartos ---------- */
.rooms{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.room{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:4px;transition:transform .18s,box-shadow .18s}
.room .ph{aspect-ratio:4/3;background:var(--ivory-2) center/cover;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.room .bd{padding:14px 16px 16px;display:grid;gap:6px}
.room h3{font-size:1.3rem;color:var(--slate)}
.room .pr{font-family:"Marcellus",serif;font-size:1.6rem;color:var(--copper-deep)}
.room .pr small{font-family:"Outfit",sans-serif;font-size:.75rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- calendário ---------- */
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.calbar h2{font-size:1.4rem;min-width:160px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.calwrap{overflow:auto;border:1px solid var(--line);border-radius:4px;background:#fff;max-height:calc(100dvh - 260px);min-height:200px}
.cal{--cw:44px;--rw:110px;width:max-content}
.cal-row{display:flex;border-bottom:1px solid var(--line)}
.cal-row:last-child{border-bottom:0}
.cal-room{position:sticky;left:0;z-index:3;width:var(--rw);flex:none;background:#fff;border-right:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;min-height:44px}
.cal-room b{font-weight:500;line-height:1.1}
.cal-room small{color:var(--muted);font-size:.72rem}
.cal-hd{position:sticky;top:0;z-index:4;background:var(--ivory-2)}
.cal-hd .cal-room{background:var(--ivory-2);z-index:5}
.cal-d{width:var(--cw);flex:none;text-align:center;font-size:.72rem;color:var(--muted);padding:4px 0;border-left:1px solid var(--line)}
.cal-d b{display:block;font-size:.95rem;color:var(--ink);font-weight:500}
.cal-d.we{background:rgba(54,55,59,.05)}
.cal-d.today b{color:#fff;background:var(--copper);border-radius:12px;width:26px;margin:0 auto}
.cal-days{position:relative;display:flex}
.cal-c{width:var(--cw);flex:none;border-left:1px solid var(--line);background:none;border-top:0;border-right:0;border-bottom:0;min-height:44px;padding:0}
.cal-c.we{background:rgba(54,55,59,.04)}
.cal-c.today{background:rgba(196,134,91,.1)}
.bar{position:absolute;top:6px;height:32px;border:0;border-radius:4px;padding:0 8px;color:#fff;font-size:.78rem;font-weight:500;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2}
.bar.s-confirmada{background:var(--copper)}
.bar.s-hospedado{background:var(--green)}
.bar.s-concluida{background:#8d8a82}
.bar.booking{background:var(--coastal-deep)}
.bar.manual{background:repeating-linear-gradient(135deg,#8d8a82 0 6px,#a09d95 6px 12px)}
.bar.conflict{box-shadow:0 0 0 2px var(--red)}

/* ---------- formulários e modal ---------- */
dialog{border:0;border-radius:6px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px -20px rgba(0,0,0,.55);background:var(--ivory);color:var(--ink);margin:auto}
dialog::backdrop{background:rgba(20,20,22,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ivory);z-index:2}
.dlg-h h2{font-size:1.3rem}
.dlg-h button{background:none;border:0;font-size:1.6rem;line-height:1;padding:4px 10px;color:var(--muted)}
.dlg-b{padding:18px 20px 22px;overflow:auto;max-height:calc(100dvh - 90px)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld label,.fld .lb{display:block;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld input,.mk-row input,.fld select,.fld textarea{width:100%;background:#fff;border:1px solid rgba(54,55,59,.25);border-radius:3px;padding:10px 12px;min-height:44px}
.fld textarea{min-height:80px;resize:vertical}
.fld .hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink);background:#fff;border:1px solid rgba(54,55,59,.25);border-radius:20px;padding:7px 13px;margin:0;cursor:pointer;user-select:none;-webkit-user-select:none}
.checks input{width:auto;min-height:0}
.checks label:has(input:checked){background:rgba(196,134,91,.16);border-color:var(--copper)}
.switches{display:grid;gap:8px}
.switches label{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink);margin:0}
.switches input{width:20px;height:20px;min-height:0;accent-color:var(--copper)}
.form-err{background:#fbeeea;border-left:4px solid var(--red);padding:10px 12px;border-radius:3px;font-size:.9rem}
.dlg-f{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.dlg-f .r{display:flex;gap:10px;margin-left:auto}
.photo-prev{aspect-ratio:16/9;background:var(--ivory-2) center/cover;border-radius:3px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.pick{display:grid;gap:10px}
.pick .btn{justify-content:flex-start;min-height:54px}

/* ---------- booking / usuarios ---------- */
.sync-card{display:grid;gap:10px}
.sync-card .line{display:flex;gap:8px;flex-wrap:wrap}
.sync-card input{flex:1 1 260px;background:#fff;border:1px solid rgba(54,55,59,.25);border-radius:3px;padding:10px 12px;min-height:42px}
.status-ok{color:#3f6b4e}.status-err{color:var(--red)}
details.how{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:16px}
details.how summary{cursor:pointer;font-weight:500}
details.how ol,details.how ul{margin:10px 0 0 20px;display:grid;gap:6px;font-size:.92rem}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:4px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
@media (min-width:821px){#toast{bottom:24px}}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.cred{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:8px}
.cred div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.cred b{word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
.roles{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.ro-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.cal-c:disabled{cursor:default}

.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding:8px 0 0;overflow-x:auto}
.bars .col{flex:1 0 12px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:12px}
.bars .col i{display:block;background:var(--copper);border-radius:2px 2px 0 0;min-height:1px}
.bars .col u{display:block;background:#3f6b4e;border-radius:2px 2px 0 0;min-height:0;text-decoration:none}
.bars-l{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{font-weight:500;text-align:left;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px 6px 0}
.tbl td{padding:8px 8px 8px 0;border-top:1px solid var(--line)}.tbl td.n,.tbl th.n{text-align:right}
.split{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:22px}
.mk-row{display:grid;gap:6px}
.mk-st{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.sec-h{font-family:"Marcellus",serif;font-weight:400;font-size:1.3rem;margin:6px 0 12px}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando…</div></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>

/* =====================  ESTADO  ===================== */
const S = {user:null,profile:null,rooms:[],syncs:[],reservations:[],blocks:[],profiles:[],tab:'hoje',month:null,
           resFilter:{q:'',status:'ativas'}};
const isAdmin = () => !!S.profile && S.profile.role === 'admin';

/* =====================  UTILIDADES  ===================== */
const $ = (s, r=document) => r.querySelector(s);

    else e.setAttribute(k,v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid==null || kid===false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const fmtD = s => parse(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const fmtDY = s => parse(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
const money = n => n==null || n==='' ? '—' : Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const overlap = (aS,aE,bS,bE) => aS < bE && bS < aE;
const roomById = id => S.rooms.find(r => r.id===id);
const roomLabel = r => r ? ('Quarto '+r.number) : 'Quarto removido';
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const digits = s => (s||'').replace(/\D/g,'');

function toast(msg, bad){
  const t = $('#toast'); t.textContent = msg; t.className = 'show'+(bad?' bad':'');
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.className=''; }, bad?5200:2600);
}
function friendly(e){
  const m = (e && e.message) || String(e);
  const c = e && e.code;
  if (c==='23P01') return 'Já existe uma reserva neste quarto nessas datas.';
  if (c==='23505') return 'Já existe um registro com esse valor (por exemplo, número de quarto repetido).';
  if (c==='23503') return 'Este registro está em uso e não pode ser removido.';
  if (c==='42501') return 'Você não tem permissão para fazer isso.';
  if (/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  return m;
}
async function run(btn, fn){
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch(e){ console.error(e); toast(friendly(e), true); }
  finally { if (btn) btn.disabled = false; }
}

/* =====================  DISPONIBILIDADE  ===================== */
const activeRes = () => S.reservations.filter(r => r.status!=='cancelada');
function roomBusyOn(roomId, day){
  const next = addDays(day,1);
  return activeRes().some(r => r.room_id===roomId && overlap(r.check_in,r.check_out,day,next))
      || S.blocks.some(b => b.room_id===roomId && overlap(b.start_date,b.end_date,day,next));
}
function conflictFor(roomId, ci, co, ignoreId){
  const r = activeRes().find(x => x.room_id===roomId && x.id!==ignoreId && overlap(x.check_in,x.check_out,ci,co));
  if (r) return 'Já existe a reserva de '+r.guest_name+' neste quarto ('+fmtD(r.check_in)+' a '+fmtD(r.check_out)+').';
  const b = S.blocks.find(x => x.room_id===roomId && overlap(x.start_date,x.end_date,ci,co));
  if (b) return b.source==='booking' ? 'O quarto está reservado no Booking.com nessas datas ('+fmtD(b.start_date)+' a '+fmtD(b.end_date)+').'
                                      : 'O quarto está bloqueado nessas datas ('+fmtD(b.start_date)+' a '+fmtD(b.end_date)+').';
  return null;
}
function conflicts(){ // reserva direta que bate com reserva do Booking (overbooking)
  const out = [];
  for (const r of activeRes()) for (const b of S.blocks) {
    if (b.source==='booking' && b.room_id===r.room_id && overlap(r.check_in,r.check_out,b.start_date,b.end_date)) out.push({r,b});
  }
  return out;
}

function viewHoje(root){
  const t = today(), active = S.rooms.filter(r=>r.active);
  root.append(head('Hoje', new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}),
    canWrite() ? h('button',{class:'btn btn-primary',onclick:()=>reservationForm(null,{})},'+ Nova reserva') : null));
  if (!S.rooms.length){ root.append(noRooms()); return; }

  const occupied = active.filter(r => roomBusyOn(r.id,t)).length;
  const arrivals = activeRes().filter(r => r.check_in===t);
  const departures = activeRes().filter(r => r.check_out===t);
  const upcoming = activeRes().filter(r => r.check_in>t && r.check_in<=addDays(t,7)).sort((a,b)=>a.check_in.localeCompare(b.check_in));

  root.append(h('div',{class:'grid stats'},
    stat(arrivals.length,'Chegadas hoje'), stat(departures.length,'Saídas hoje'),
    stat(occupied+' / '+active.length,'Quartos ocupados'), stat(active.length-occupied,'Quartos livres')));

  const cf = conflicts();
  cf.forEach(({r,b}) => root.append(h('div',{class:'alert'}, h('b',{},'Conflito com o Booking: '),
    r.guest_name+' ('+roomLabel(roomById(r.room_id))+', '+fmtD(r.check_in)+' a '+fmtD(r.check_out)+') coincide com uma reserva do Booking.com ('+fmtD(b.start_date)+' a '+fmtD(b.end_date)+'). Resolva um dos dois.')));
  S.syncs.filter(s => s.ical_url && s.last_status && s.last_status!=='ok').forEach(s =>
    root.append(h('div',{class:'alert warn'}, h('b',{},'Falha na sincronização do Booking ('+roomLabel(roomById(s.room_id))+'): '), s.last_status)));

  root.append(section('Chegadas de hoje', arrivals.length), list(arrivals, r =>
    r.status==='confirmada' && canWrite() ? h('button',{class:'btn btn-primary btn-sm',onclick:e=>setStatus(r,'hospedado',e.currentTarget)},'Check-in feito') : chipFor(r)));
  root.append(section('Saídas de hoje', departures.length), list(departures, r =>
    r.status==='hospedado' && canWrite() ? h('button',{class:'btn btn-primary btn-sm',onclick:e=>setStatus(r,'concluida',e.currentTarget)},'Check-out feito') : chipFor(r)));
  root.append(section('Próximos 7 dias', upcoming.length), list(upcoming, r => chipFor(r)));
}

function viewCalendario(root){
  const {y,m} = S.month;
  const first = y+'-'+pad(m+1)+'-01', dim = new Date(y,m+1,0).getDate(), next = ymd(new Date(y,m+1,1));
  const t = today(), rooms = S.rooms.filter(r=>r.active);
  const shift = n => { const d = new Date(y,m+n,1); S.month = {y:d.getFullYear(), m:d.getMonth()}; render(); };
  root.append(head('Calendário', 'Toque num dia vazio para reservar ou bloquear; toque numa barra para abrir.'));
  root.append(h('div',{class:'calbar'},
    h('button',{class:'btn btn-ghost btn-sm','aria-label':'Mês anterior',onclick:()=>shift(-1)},'‹'),
    h('h2',{}, (t=>t.charAt(0).toUpperCase()+t.slice(1))(new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))),
    h('button',{class:'btn btn-ghost btn-sm','aria-label':'Próximo mês',onclick:()=>shift(1)},'›'),
    h('button',{class:'btn btn-ghost btn-sm',onclick:()=>{const n=new Date();S.month={y:n.getFullYear(),m:n.getMonth()};render();}},'Hoje')));
  root.append(h('div',{class:'legend'},
    leg('var(--copper)','Confirmada'), leg('var(--green)','Hospedado'), leg('#8d8a82','Concluída'),
    leg('var(--coastal-deep)','Booking.com'), leg('repeating-linear-gradient(135deg,#8d8a82 0 4px,#a09d95 4px 8px)','Bloqueio')));
  if (!rooms.length){ root.append(noRooms()); return; }

  const cw = 44;
  const dayHead = h('div',{class:'cal-row cal-hd'}, h('div',{class:'cal-room'}, h('small',{},'Quarto')));
  for (let d=1; d<=dim; d++){
    const date = y+'-'+pad(m+1)+'-'+pad(d), wd = parse(date).getDay();
    dayHead.append(h('div',{class:'cal-d'+(wd===0||wd===6?' we':'')+(date===t?' today':'')},
      h('b',{},d), ['D','S','T','Q','Q','S','S'][wd]));
  }
  const cal = h('div',{class:'cal'}, dayHead);
  for (const room of rooms){
    const days = h('div',{class:'cal-days'});
    for (let d=1; d<=dim; d++){
      const date = y+'-'+pad(m+1)+'-'+pad(d), wd = parse(date).getDay();
      days.append(h('button',{type:'button',class:'cal-c'+(wd===0||wd===6?' we':'')+(date===t?' today':''),
        'aria-label':'Quarto '+room.number+', dia '+d, onclick:canWrite()?()=>cellMenu(room,date):null,disabled:!canWrite()}));
    }
    const seg = (s,e,cls,label,title,onclick,extra) => {
      const cs = s<first ? first : s, ce = e>next ? next : e;
      const idx = diffDays(first,cs), len = diffDays(cs,ce);
      if (len<=0) return;
      days.append(h('button',{type:'button',class:'bar '+cls+(extra||''),title,
        style:'left:'+(idx*cw+2)+'px;width:'+(len*cw-4)+'px',onclick},label));
    };
    S.blocks.filter(b => b.room_id===room.id).forEach(b => seg(b.start_date,b.end_date,b.source==='booking'?'booking':'manual',
      b.source==='booking' ? 'Booking.com' : (b.note||'Bloqueado'), (b.source==='booking'?'Reservado no Booking.com':'Bloqueio')+' · '+fmtD(b.start_date)+' a '+fmtD(b.end_date)+(b.note?' · '+b.note:''), ()=>blockView(b,room)));
    activeRes().filter(r => r.room_id===room.id).forEach(r => {
      const bad = S.blocks.some(b => b.source==='booking' && b.room_id===room.id && overlap(r.check_in,r.check_out,b.start_date,b.end_date));
      seg(r.check_in,r.check_out,'s-'+r.status,r.guest_name,r.guest_name+' · '+fmtD(r.check_in)+' a '+fmtD(r.check_out)+' · '+STATUS[r.status],()=>reservationForm(r),bad?' conflict':'');
    });
    cal.append(h('div',{class:'cal-row'}, h('div',{class:'cal-room'}, h('b',{},room.number), h('small',{},TYPES[room.type]||room.type)), days));
  }
  root.append(h('div',{class:'calwrap'}, cal));
}

  } else blockForm(b);

function blockForm(b, defaults){
  const d = b || defaults || {};
  const err = h('div',{class:'form-err',hidden:true});
  const f = h('form',{class:'form'});
  const room = sel('room_id', S.rooms.filter(r=>r.active||r.id===d.room_id).map(r=>[r.id,roomLabel(r)+' — '+(TYPES[r.type]||r.type)]), d.room_id||S.rooms[0]?.id);
  const s = h('input',{type:'date',name:'start',required:true,value:d.start_date||today()});
  const e = h('input',{type:'date',name:'end',required:true,value:d.end_date ? addDays(d.end_date,-1) : (d.start_date||today())});

  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(res => c.toBlob(res,'image/jpeg',.85));
}

const ACAO_LABEL = {whatsapp_click:'Clique no WhatsApp', room_click:'Interesse em quarto'};
const DEV_LABEL = {mobile:'Celular',desktop:'Computador',tablet:'Tablet','?':'Outro'};
function overlapNights(ci, co, d0, d1){ // noites de [ci,co) dentro de [d0,d1)
  const a = ci > d0 ? ci : d0, b = co < d1 ? co : d1; return a < b ? diffDays(a,b) : 0;
}
function hotelStats(dias){
  const d1 = addDays(today(),1), d0 = addDays(d1,-dias);
  const rooms = S.rooms.filter(r => r.active).length;
  const avail = rooms * dias;
  const direct = S.reservations.filter(r => r.status!=='cancelada');
  let nDirect = 0, nBooking = 0, receita = 0, reservas = 0; const porOrigem = {};
  direct.forEach(r => {
    const n = overlapNights(r.check_in, r.check_out, d0, d1); nDirect += n;
    if (r.check_in >= d0 && r.check_in < d1){ reservas++; receita += Number(r.total)||0; const o = r.source||'direto'; porOrigem[o] = (porOrigem[o]||0)+1; }
  });
  S.blocks.filter(b => b.source==='booking').forEach(b => { nBooking += overlapNights(b.start_date, b.end_date, d0, d1); });
  const occ = avail ? Math.min(100, Math.round((nDirect+nBooking)/avail*100)) : 0;
  return {rooms, occ, nDirect, nBooking, receita, reservas, porOrigem};
}
async function viewEstatisticas(root){
  const dias = S.statDias || 30;
  const per = h('select',{'aria-label':'Período'});
  [[7,'Últimos 7 dias'],[30,'Últimos 30 dias'],[90,'Últimos 90 dias']].forEach(([v,l]) => per.append(h('option',{value:String(v)},l)));
  per.value = String(dias);
  per.addEventListener('change', () => { S.statDias = Number(per.value); render(); });
  root.append(head('Estatísticas','Visitas do site e resultado do hotel no período.', per));
  const box = h('div',{}, h('div',{class:'loading'},'Carregando…')); root.append(box);
  const {data:st,error} = await sb.rpc('stats_resumo',{p_dias:dias}); if (error) throw error;
  const hs = hotelStats(dias);
  const pct = (a,b) => b ? (Math.round(a/b*1000)/10).toLocaleString('pt-BR')+'%' : '—';
  const card = (v,l) => h('div',{class:'card stat'}, h('div',{class:'v'},String(v)), h('div',{class:'l'},l));
  const out = [];
  if (!st.visitantes && !st.page_views){
    out.push(h('div',{class:'alert warn'}, h('b',{},'Ainda sem visitas registradas. '), 'O site começa a contar assim que a versão nova for publicada. Suas visitas não contam se você abrir o site com ?notrack=1 neste aparelho.'));
  }
  out.push(h('h2',{class:'sec-h'},'Site'));
  out.push(h('div',{class:'grid stats'},
    card(st.visitantes,'Visitantes'), card(st.whatsapp,'Cliques no WhatsApp'),
    card(pct(st.whatsapp_sessoes, st.visitantes),'Visitantes que chamaram'), card(st.telefone,'Ligações'), card(st.mapa,'Cliques no mapa')));
  // gráfico por dia
  const byDay = {}; (st.por_dia||[]).forEach(x => { byDay[x.dia] = x; });
  const days = []; for (let i=dias-1;i>=0;i--) days.push(addDays(today(),-i));
  const max = Math.max(1, ...days.map(d => (byDay[d]||{}).visitantes||0));
  const bars = h('div',{class:'bars',role:'img','aria-label':'Visitantes por dia'}, days.map(d => {
    const x = byDay[d]||{visitantes:0,whatsapp:0};
    return h('div',{class:'col',title:fmtD(d)+': '+x.visitantes+' visitantes, '+x.whatsapp+' cliques no WhatsApp'},
      h('u',{style:'height:'+Math.round((x.whatsapp||0)/max*100)+'%'}), h('i',{style:'height:'+Math.round((x.visitantes||0)/max*100)+'%'}));
  }));
  out.push(h('div',{class:'card',style:'margin-bottom:22px'}, h('b',{},'Visitantes por dia'), bars,
    h('div',{class:'bars-l'}, h('span',{},fmtD(days[0])), h('span',{},fmtD(days[days.length-1]))),
    h('div',{class:'legend'}, h('span',{}, h('b',{style:'background:var(--copper)'}),'Visitantes'), h('span',{}, h('b',{style:'background:#3f6b4e'}),'Cliques no WhatsApp'))));
  // tabelas
  const tbl = (cols, rows, empty) => rows.length ? h('table',{class:'tbl'}, h('thead',{}, h('tr',{}, cols.map((c,i)=>h('th',{class:i?'n':''},c)))),
      h('tbody',{}, rows.map(r => h('tr',{}, r.map((c,i)=>h('td',{class:i?'n':''},String(c))))))) : h('p',{class:'muted'},empty);
  out.push(h('div',{class:'split'},
    h('div',{class:'card'}, h('b',{},'De onde vêm'), tbl(['Origem','Visitantes','WhatsApp'], (st.por_origem||[]).map(o=>[o.origem,o.visitantes,o.whatsapp]), 'Sem dados ainda.')),
    h('div',{class:'card'}, h('b',{},'O que mais chamam atenção'), tbl(['Ação','Botão / quarto','Vezes'], (st.por_acao||[]).map(a=>[ACAO_LABEL[a.event]||a.event,a.label||'—',a.n]), 'Sem dados ainda.')),
    h('div',{class:'card'}, h('b',{},'Aparelhos'), tbl(['Aparelho','Visitantes'], (st.por_dispositivo||[]).map(d=>[DEV_LABEL[d.device]||d.device,d.visitantes]), 'Sem dados ainda.'))));
  // hotel
  out.push(h('h2',{class:'sec-h'},'Hotel'));
  out.push(h('div',{class:'grid stats'}, card(hs.occ+'%','Ocupação'), card(hs.reservas,'Reservas diretas'), card(money(hs.receita),'Valor das reservas diretas'),
    card(hs.nBooking,'Noites vindas do Booking')));
  out.push(h('p',{class:'muted'},'Ocupação = noites reservadas (diretas + Booking) ÷ noites disponíveis ('+hs.rooms+' quartos ativos × '+dias+' dias). O valor considera só as reservas diretas lançadas aqui, pela data de entrada.'));
  const ro = Object.entries(hs.porOrigem).map(([k,n]) => [SOURCES[k]||k, n]);
  out.push(h('div',{class:'card',style:'max-width:420px'}, h('b',{},'Reservas diretas por origem'), tbl(['Origem','Reservas'], ro, 'Nenhuma reserva direta no período.')));
  box.replaceChildren(...out);
}

/* =====================  VIEW: MARKETING  ===================== */
const MK = [
  {k:'ga4_id', t:'Google Analytics 4 (ID de medição)', ph:'G-XXXXXXXXXX', rx:/^G-[A-Z0-9]{4,14}$/, how:'analytics.google.com → Admin → Fluxos de dados → seu site → “ID da métrica”. Começa com G-.'},
  {k:'gtm_id', t:'Google Tag Manager (opcional)', ph:'GTM-XXXXXXX', rx:/^GTM-[A-Z0-9]{4,10}$/, how:'tagmanager.google.com → seu contêiner → ID no topo. Se preencher, o site usa só o Tag Manager e ignora o GA4 e o Ads abaixo (configure tudo dentro dele).'},
  {k:'google_ads_id', t:'Google Ads (ID da conversão)', ph:'AW-123456789', rx:/^AW-\d{6,12}$/, how:'Google Ads → Metas → Conversões → nova conversão “Leads / Contato” → Configuração da tag. Aparece como AW-123456789.'},
  {k:'google_ads_whatsapp_label', t:'Google Ads (rótulo da conversão do WhatsApp)', ph:'AbC-dEfGhIjKl', rx:/^[\w-]{4,40}$/, how:'Na mesma tela da conversão: em “send_to” vem AW-123456789/AbC-dEfGhIjKl. Cole só a parte depois da barra.'},
  {k:'meta_pixel_id', t:'Meta Pixel (ID do pixel)', ph:'1234567890123456', rx:/^\d{8,20}$/, how:'business.facebook.com → Gerenciador de Eventos → Fontes de dados → seu pixel → ID (só números). Use um pixel do hotel, não de outro negócio.'}
];
async function viewMarketing(root){
  root.append(head('Marketing','Cole aqui os códigos do Google e da Meta. O site passa a usar na hora, sem precisar publicar de novo.'));
  const box = h('div',{}, h('div',{class:'loading'},'Carregando…')); root.append(box);
  const {data,error} = await sb.from('site_settings').select('key,value'); if (error) throw error;
  const cur = {}; data.forEach(r => cur[r.key] = r.value||'');
  const inputs = {};
  const rows = MK.map(m => {
    const i = h('input',{type:'text',value:cur[m.k]||'',placeholder:m.ph,autocomplete:'off',autocapitalize:'none',spellcheck:'false','aria-label':m.t}); inputs[m.k] = i;
    const on = !!(cur[m.k]||'').trim();
    return h('div',{class:'card mk-row'}, h('div',{class:'mk-st'}, h('b',{},m.t), h('span',{class:'chip '+(on?'green':'gray')}, on?'Ativo':'Não configurado')), i,
      h('details',{class:'how',style:'margin:0;padding:10px 12px'}, h('summary',{},'Onde encontro'), h('p',{class:'muted',style:'margin:8px 0 0'},m.how)));
  });
  const err = h('div',{class:'form-err',hidden:true});
  const save = h('button',{type:'button',class:'btn btn-primary',onclick:e=>run(e.currentTarget, async()=>{
    err.hidden = true; const rowsOut = [];
    for (const m of MK){ const v = inputs[m.k].value.trim(); if (v && !m.rx.test(v)){ err.textContent = m.t+': formato inválido. Exemplo: '+m.ph; err.hidden = false; return; } rowsOut.push([m.k,v]); }
    const res = await Promise.all(rowsOut.map(([k,v]) => sb.from('site_settings').update({value:v}).eq('key',k)));
    const bad = res.find(r => r.error); if (bad) throw bad.error;
    toast('Salvo. O site já usa os novos códigos.'); render(); })},'Salvar códigos');
  const dbg = location.origin + location.pathname.replace(/painel\/?(index\.html)?$/,'');
  box.replaceChildren(
    h('div',{class:'grid'}, rows), err, h('div',{style:'margin:14px 0 22px'}, save),
    h('div',{class:'card'}, h('b',{},'Como conferir que está funcionando'),
      h('ol',{style:'margin:10px 0 0 20px;display:grid;gap:6px'},
        h('li',{},'Depois de salvar, abra o site com ',h('b',{},'?ht_debug=1'),' no final do endereço e aceite os cookies. Os eventos aparecem no console do navegador.'),
        h('li',{},'No Google Analytics, vá em Relatórios → Tempo real e clique em “Reservar pelo WhatsApp”. No Meta, use o Gerenciador de Eventos → Testar eventos.'),
        h('li',{},'Seus próprios cliques contam como visita. Para não contar neste aparelho, abra uma vez ',h('a',{href:dbg+'?notrack=1',target:'_blank',rel:'noopener'},'este link'),'.')),
      h('p',{class:'muted',style:'margin:10px 0 0'},'O site já envia: visita, clique no WhatsApp (conversão de contato/lead), ligação, mapa, interesse em cada quarto, rolagem e seções vistas. O Pixel da Meta só carrega depois que o visitante aceita os cookies.')));
}

/* =====================  VIEW: USUÁRIOS  ===================== */
const SENHA_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
function gerarSenha(n=10){
  const a = new Uint32Array(n); crypto.getRandomValues(a);
  return Array.from(a, x => SENHA_CHARS[x % SENHA_CHARS.length]).join('');
}
async function copiar(txt, msg){
  try { await navigator.clipboard.writeText(txt); toast(msg||'Copiado.'); }
  catch(e){ toast('Não consegui copiar. Selecione o texto e copie manualmente.', true); }
}
function roleOptions(withPending){ return ROLE_ORDER.filter(r => withPending || r!=='pendente').map(r => [r, ROLES[r]]); }

function senhaField(){
  const pw = h('input',{type:'text',name:'senha',required:true,minlength:'8',autocomplete:'off',autocapitalize:'none',spellcheck:'false',value:gerarSenha()});
  const again = h('button',{type:'button',class:'btn btn-ghost btn-sm',onclick:()=>{ pw.value = gerarSenha(); }},'Gerar outra');
  return {pw, node: fld('Senha (mínimo 8 caracteres)', h('div',{style:'display:flex;gap:8px'}, pw, again), 'Sugerimos uma senha forte. Anote ou copie antes de salvar. A pessoa poderá usar esta senha para entrar.')};
}
function credenciais(titulo, email, senha, papel){
  const txt = 'Painel do Hotel Itapuã\nEndereço: '+location.origin+location.pathname+'\nE-mail: '+email+'\nSenha: '+senha;
  openModal(titulo, h('div',{class:'form'},
    h('p',{}, 'Passe estes dados para a pessoa. Por segurança, esta senha não aparece de novo.'),
    h('div',{class:'cred'}, h('div',{}, h('span',{class:'muted'},'E-mail'), h('b',{},email)), h('div',{}, h('span',{class:'muted'},'Senha'), h('b',{},senha)),
      papel ? h('div',{}, h('span',{class:'muted'},'Acesso'), h('b',{},ROLES[papel])) : null),
    h('div',{class:'dlg-f'}, h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
      h('button',{type:'button',class:'btn btn-primary',onclick:()=>copiar(txt,'Dados copiados.')},'Copiar tudo'),
      h('a',{class:'btn btn-ghost',href:'https://wa.me/?text='+encodeURIComponent(txt),target:'_blank',rel:'noopener'},'Enviar por WhatsApp')),
      h('div',{class:'r'}, h('button',{type:'button',class:'btn btn-ghost',onclick:closeModal},'Fechar')))));
}
function userForm(){
  const err = h('div',{class:'form-err',hidden:true});
  const f = h('form',{class:'form'});
  const name = h('input',{type:'text',name:'name',maxlength:'80',required:true,autocomplete:'off',placeholder:'Ex.: Maria da Recepção'});
  const email = h('input',{type:'email',name:'email',required:true,inputmode:'email',autocomplete:'off',autocapitalize:'none',autocorrect:'off',placeholder:'maria@exemplo.com'});
  const role = sel('role', roleOptions(false), 'recepcao');
  const hint = h('div',{class:'hint'}, ROLE_DESC[role.value]);
  role.addEventListener('change', () => { hint.textContent = ROLE_DESC[role.value]; });
  const {pw, node:pwNode} = senhaField();
  f.append(fld('Nome',name), fld('E-mail (será o login)',email), fld('Nível de acesso',role,null), hint, pwNode, err,
    h('div',{class:'dlg-f'}, h('div',{}), h('div',{class:'r'},
      h('button',{type:'button',class:'btn btn-ghost',onclick:closeModal},'Cancelar'),
      h('button',{type:'submit',class:'btn btn-primary'},'Criar usuário'))));
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); err.hidden = true;
    const btn = f.querySelector('[type=submit]');
    await run(btn, async () => {
      const {error} = await sb.rpc('admin_criar_usuario',{p_email:email.value.trim(),p_senha:pw.value,p_nome:name.value.trim(),p_papel:role.value});
      if (error){ err.textContent = friendly(error); err.hidden = false; return; }
      const em = email.value.trim().toLowerCase(), sn = pw.value, pa = role.value;
      toast('Usuário criado.'); credenciais('Usuário criado', em, sn, pa); S.tab==='usuarios' && render();
    });
  });
  openModal('Novo usuário', f);
}
function passwordForm(p){
  const err = h('div',{class:'form-err',hidden:true});
  const f = h('form',{class:'form'});
  const {pw, node:pwNode} = senhaField();
  f.append(h('p',{},'Nova senha para ', h('b',{},p.name||p.email), '.'), pwNode, err,
    h('div',{class:'dlg-f'}, h('div',{}), h('div',{class:'r'},
      h('button',{type:'button',class:'btn btn-ghost',onclick:closeModal},'Cancelar'),
      h('button',{type:'submit',class:'btn btn-primary'},'Salvar nova senha'))));
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); err.hidden = true;
    await run(f.querySelector('[type=submit]'), async () => {
      const {error} = await sb.rpc('admin_redefinir_senha',{p_user:p.user_id,p_senha:pw.value});
      if (error){ err.textContent = friendly(error); err.hidden = false; return; }
      credenciais('Senha alterada', p.email, pw.value, null);
    });
  });
  openModal('Redefinir senha', f);
}
async function viewUsuarios(root){
  root.append(head('Usuários','Quem pode entrar no painel e o que cada pessoa pode fazer.',
    h('button',{class:'btn btn-primary',onclick:userForm},'+ Novo usuário')));
  root.append(h('details',{class:'how'}, h('summary',{},'O que cada nível de acesso pode fazer'),
    h('ul',{class:'roles'}, ROLE_ORDER.map(r => h('li',{}, h('b',{},ROLES[r]+': '), ROLE_DESC[r])))));
  const box = h('div',{class:'list'}, h('div',{class:'loading'},'Carregando…')); root.append(box);
  const {data,error} = await sb.from('profiles').select('*').order('created_at'); if (error) throw error;
  S.profiles = data;
  box.replaceChildren(...data.map(p => {
    const me = p.user_id===S.user.id;
    const s = sel('role',roleOptions(true),p.role); s.disabled = me; s.setAttribute('aria-label','Nível de acesso de '+(p.name||p.email));
    s.style.cssText='min-height:42px;border:1px solid var(--line);border-radius:3px;padding:6px 10px;background:#fff';
    s.addEventListener('change', () => run(s, async()=>{
      const {error} = await sb.from('profiles').update({role:s.value}).eq('user_id',p.user_id); if (error) throw error;
      p.role = s.value; toast('Nível de acesso atualizado.'); }));
    const actions = me ? null : h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
      h('button',{type:'button',class:'btn btn-ghost btn-sm',onclick:()=>passwordForm(p)},'Nova senha'),
      h('button',{type:'button',class:'btn btn-danger btn-sm',onclick:e=>confirmDelete(e.currentTarget,async()=>{
        const {error} = await sb.rpc('admin_remover_usuario',{p_user:p.user_id}); if (error) throw error;
        toast('Usuário removido.'); render(); })},'Remover'));
    return h('div',{class:'item'}, h('div',{class:'main-t'}, h('b',{},p.name||p.email), me?' (você)':'', h('div',{class:'muted'},p.email)),
      p.role==='pendente'?h('span',{class:'chip copper'},'Sem acesso'):null, s, actions);
  }));
}

/* =====================  INÍCIO  ===================== */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session){ renderLogin(); return; }
  S.user = session.user; await enter();
}
sb.auth.onAuthStateChange((ev) => { if (ev==='SIGNED_OUT') setTimeout(renderLogin,0); });
boot().catch(e => { console.error(e); renderLogin(friendly(e)); });
window.__painel = {S}; // facilita testes
})();
</script>
